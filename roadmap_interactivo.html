<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Explorador de Objetivos Infinito</title>
    <style>
        :root {
            --bg-color: #0d1117;
            --card-bg: #161b22;
            --border-color: #30363d;
            --text-color: #c9d1d9;
            --accent-color: #58a6ff;
            --success-color: #238636;
            --danger-color: #da3637;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 800px;
        }

        h1 {
            color: #ffffff;
            text-align: center;
            margin-bottom: 30px;
        }

        /* CONTENEDOR PRINCIPAL DEL ÁRBOL */
        .arbol-raiz {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 20px;
        }

        /* LOGICA VISUAL DE NODOS ANIDADOS */
        .nodo {
            list-style: none;
            margin-top: 10px;
            padding-left: 20px;
            border-left: 1px dashed var(--border-color);
        }

        .nodo-encabezado {
            display: flex;
            align-items: center;
            background: #0d1117;
            padding: 8px 12px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            gap: 10px;
            transition: border-color 0.2s;
        }

        .nodo-encabezado:hover {
            border-color: var(--accent-color);
        }

        .texto-editable {
            flex: 1;
            outline: none;
            color: var(--text-color);
        }

        .texto-editable:focus {
            color: #ffffff;
        }

        /* BOTONES MODULARES */
        .btn-accion {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 1rem;
            padding: 4px 8px;
            border-radius: 4px;
            transition: background 0.2s;
        }

        .btn-accion:hover {
            background: #21262d;
        }

        .btn-toggle {
            color: var(--accent-color);
            font-weight: bold;
        }

        /* CONTENEDOR DE HIJOS (SUB-CARPETAS) */
        .nodo-hijos {
            margin: 0;
            padding: 0;
        }

        .oculto {
            display: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>🌳 Explorador de Objetivos Recursivo</h1>
        <p style="text-align: center; color: #8b949e; margin-bottom: 20px;">
            Haz clic en los textos para editarlos. Usa <b>+</b> para anidar infinitamente, <b>📂</b> para expandir/colapsar y <b>🗑️</b> para borrar.
        </p>

        <!-- RAÍZ DEL ÁRBOL -->
        <div class="arbol-raiz">
            <button class="btn-accion" style="background-color: var(--success-color); color: white; font-weight: bold; margin-bottom: 15px;" onclick="crearNodoRaiz()">+ Agregar Rama Principal</button>
            
            <ul id="raiz-principal" style="padding: 0; margin: 0;">
                <!-- Aquí se inyectarán todas las ramas de forma recursiva -->
            </ul>
        </div>
    </div>

    <!-- ================= LÓGICA RECURSIVA EN JAVASCRIPT ================= -->  
     <script>
        // Variable global para rastrear el elemento que se está arrastrando (Drag and Drop)
        let elementoArrastrado = null;

        // Función auxiliar para enfocar y sombrear texto
        function seleccionarTextoElemento(elemento) {
            elemento.focus();
            if (window.getSelection && document.createRange) {
                let rango = document.createRange();
                rango.selectNodeContents(elemento);
                let seleccion = window.getSelection();
                seleccion.removeAllRanges();
                seleccion.addRange(rango);
            }
        }

        // Función para agregar una Rama Principal en la raíz
        function crearNodoRaiz(event) {
            // Reutiliza el menú dinámico en la posición del botón de arriba
            abrirMenuTipos(event, function(tipo) {
                let raiz = document.getElementById("raiz-principal");
                let nuevoNodo = generarEstructuraNodo("Nueva Rama Principal", tipo);
                raiz.appendChild(nuevoNodo);
                
                let texto = nuevoNodo.querySelector(".texto-editable");
                texto.contentEditable = "true";
                seleccionarTextoElemento(texto);
            });
        }

        // FUNCIÓN CLAVE: Despliega un menú flotante con 3 botones junto al cursor
        function abrirMenuTipos(event, callback) {
            event.stopPropagation();
            
            // Elimina cualquier menú anterior que se haya quedado abierto
            let menuPrevio = document.getElementById("menu-tipos-flotante");
            if (menuPrevio) menuPrevio.remove();

            // Crea el contenedor del menú estilizado (Look & Feel estilo GitHub)
            let menu = document.createElement("div");
            menu.id = "menu-tipos-flotante";
            menu.style.position = "fixed";
            menu.style.top = (event.clientY + 10) + "px";
            menu.style.left = event.clientX + "px";
            menu.style.backgroundColor = "#21262d";
            menu.style.border = "1px solid var(--border-color)";
            menu.style.borderRadius = "6px";
            menu.style.padding = "6px";
            menu.style.boxShadow = "0 8px 24px rgba(0,0,0,0.5)";
            menu.style.zIndex = "1000";
            menu.style.display = "flex";
            menu.style.flexDirection = "column";
            menu.style.gap = "4px";

            // Datos de los 3 botones
            const opciones = [
                { tipo: "folder", texto: "📁 Folder" },
                { tipo: "nota", texto: "📝 Nota" },
                { tipo: "tarea", texto: "✅ Tarea" }
            ];

            opciones.forEach(opc => {
                let btn = document.createElement("button");
                btn.innerText = opc.texto;
                btn.style.background = "none";
                btn.style.border = "none";
                btn.style.color = "var(--text-color)";
                btn.style.padding = "6px 12px";
                btn.style.textAlign = "left";
                btn.style.cursor = "pointer";
                btn.style.borderRadius = "4px";
                btn.style.fontSize = "0.9rem";
                
                btn.onhover = function() { btn.style.backgroundColor = "#30363d"; };
                btn.onclick = function(e) {
                    e.stopPropagation();
                    callback(opc.tipo);
                    menu.remove();
                };
                
                // Efecto hover nativo en JS
                btn.addEventListener("mouseenter", () => btn.style.backgroundColor = "#30363d");
                btn.addEventListener("mouseleave", () => btn.style.backgroundColor = "transparent");
                
                menu.appendChild(btn);
            });

            document.body.appendChild(menu);

            // Cierra el menú automáticamente si das clic en cualquier otra parte de la pantalla
            setTimeout(() => {
                document.addEventListener("click", function cerrarMenu() {
                    if (menu) menu.remove();
                    document.removeEventListener("click", cerrarMenu);
                });
            }, 10);
        }

        // FUNCIÓN CONSTRUCTORA RECURSIVA CON DRAG & DROP Y MENU DE 3 BOTONES
        function generarEstructuraNodo(textoInicial, tipo) {
            let li = document.createElement("li");
            li.className = "nodo";
            li.draggable = true; // Activa la propiedad para poder arrastrarlo

            let encabezado = document.createElement("div");
            encabezado.className = "nodo-encabezado";
            encabezado.style.cursor = "grab";
            encabezado.style.display = "flex";
            encabezado.style.alignItems = "flex-start";
            encabezado.style.width = "100%";
            encabezado.style.boxSizing = "border-box";

            let iconoVisual = document.createElement("span");
            iconoVisual.style.marginRight = "5px";
            iconoVisual.style.flexShrink = "0";
            
            if (tipo === "folder") iconoVisual.innerText = "📁";
            if (tipo === "nota") iconoVisual.innerText = "📝";
            if (tipo === "tarea") iconoVisual.innerText = "🔲";

            let texto = document.createElement("span");
            texto.className = "texto-editable";
            texto.contentEditable = "false"; 
            texto.innerText = textoInicial;
            texto.style.flex = "1";
            texto.style.wordBreak = "break-all";
            texto.style.whiteSpace = "normal";
            texto.style.paddingRight = "10px";

            if (tipo === "tarea") {
                iconoVisual.style.cursor = "pointer";
                iconoVisual.onclick = function(e) {
                    e.stopPropagation();
                    if(iconoVisual.innerText === "🔲") {
                        iconoVisual.innerText = "✅";
                        texto.style.textDecoration = "line-through";
                        texto.style.color = "#8b949e";
                    } else {
                        iconoVisual.innerText = "🔲";
                        texto.style.textDecoration = "none";
                        texto.style.color = "var(--text-color)";
                    }
                }
            }

            texto.onkeydown = function(e) {
                if (e.key === "Enter" && tipo !== "nota") {
                    e.preventDefault();
                    texto.blur();
                }
            };

            texto.onblur = function() {
                texto.contentEditable = "false";
            };

            let accionesContenedor = document.createElement("div");
            accionesContenedor.style.display = "flex";
            accionesContenedor.style.flexShrink = "0";

            let btnEditar = document.createElement("button");
            btnEditar.className = "btn-accion";
            btnEditar.innerText = "✏️";
            btnEditar.onclick = function(e) {
                e.stopPropagation(); 
                texto.contentEditable = "true";
                seleccionarTextoElemento(texto);
            };

            let btnAgregarHijo = document.createElement("button");
            btnAgregarHijo.className = "btn-accion";
            btnAgregarHijo.style.color = "var(--accent-color)";
            btnAgregarHijo.innerText = "+";
            
            btnAgregarHijo.onclick = function(e) {
                abrirMenuTipos(e, function(tipoHijo) {
                    let contenedorHijos = li.querySelector(".nodo-hijos");
                    contenedorHijos.classList.remove("oculto");
                    if (tipo === "folder") iconoVisual.innerText = "📂";
                    
                    let textoPorDefecto = "Nuevo " + tipoHijo;
                    if(tipoHijo === "nota") textoPorDefecto = "Escribe aquí una nota detallada...";
                    
                    let subNodo = generarEstructuraNodo(textoPorDefecto, tipoHijo);
                    contenedorHijos.appendChild(subNodo);

                    let subTexto = subNodo.querySelector(".texto-editable");
                    subTexto.contentEditable = "true";
                    seleccionarTextoElemento(subTexto);
                });
            };

            let btnEliminar = document.createElement("button");
            btnEliminar.className = "btn-accion";
            btnEliminar.innerText = "🗑️";
            btnEliminar.onclick = function(e) {
                e.stopPropagation(); 
                li.remove();
            };

            let ulHijos = document.createElement("ul");
            ulHijos.className = "nodo-hijos";

            encabezado.onclick = function() {
                if (tipo === "folder" && texto.contentEditable !== "true") {
                    if (ulHijos.children.length > 0) {
                        ulHijos.classList.toggle("oculto");
                        iconoVisual.innerText = ulHijos.classList.contains("oculto") ? "📁" : "📂";
                    }
                }
            };

            encabezado.appendChild(iconoVisual);
            encabezado.appendChild(texto);
            accionesContenedor.appendChild(btnEditar);
            accionesContenedor.appendChild(btnAgregarHijo);
            accionesContenedor.appendChild(btnEliminar);
            encabezado.appendChild(accionesContenedor);
            
            li.appendChild(encabezado);
            li.appendChild(ulHijos);

            // ================= LOGICA DE ARRASTRE CORREGIDA (DRAG & DROP) =================
            li.addEventListener("dragstart", function(e) {
                e.stopPropagation();
                elementoArrastrado = li;
                encabezado.style.cursor = "grabbing";
                li.style.opacity = "0.4";
            });

            li.addEventListener("dragend", function(e) {
                e.stopPropagation();
                encabezado.style.cursor = "grab";
                li.style.opacity = "1";
                elementoArrastrado = null;
            });

            li.addEventListener("dragover", function(e) {
                e.preventDefault();
                e.stopPropagation();
            });

            li.addEventListener("drop", function(e) {
                e.preventDefault();
                e.stopPropagation();
                
                if (elementoArrastrado && elementoArrastrado !== li && !elementoArrastrado.contains(li)) {
                    if (tipo === "folder") {
                        ulHijos.appendChild(elementoArrastrado);
                        ulHijos.classList.remove("oculto");
                        if (iconoVisual.innerText === "📁") iconoVisual.innerText = "📂";
                    } else {
                        li.parentNode.insertBefore(elementoArrastrado, li.nextSibling);
                    }
                }
            });

            return li;
        }

        // PRE-CARGA INICIAL
        window.onload = function() {
            let raiz = document.getElementById("raiz-principal");
            
            let ramaAgenda = generarEstructuraNodo("📆 Agenda Personal", "folder");
            let ramaUanl = generarEstructuraNodo("🎓 Estudios UANL", "folder");
            let ramaLkq = generarEstructuraNodo("🚗 Operaciones LKQ", "folder");

            raiz.appendChild(ramaAgenda);
            raiz.appendChild(ramaUanl);
            raiz.appendChild(ramaLkq);
        };
    </script>
</body>
</html>
