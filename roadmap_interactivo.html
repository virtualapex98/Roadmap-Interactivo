<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Explorador de Objetivos Infinito</title>
    <style>
        :root {
            --bg-color: #0d1117;
            --card-bg: #161b22;
            --border-color: #30363d;
            --text-color: #c9d1d9;
            --accent-color: #58a6ff;
            --success-color: #238636;
            --danger-color: #da3637;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 800px;
        }

        h1 {
            color: #ffffff;
            text-align: center;
            margin-bottom: 30px;
        }

        /* CONTENEDOR PRINCIPAL DEL ÁRBOL */
        .arbol-raiz {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 20px;
        }

        /* LOGICA VISUAL DE NODOS ANIDADOS */
        .nodo {
            list-style: none;
            margin-top: 10px;
            padding-left: 20px;
            border-left: 1px dashed var(--border-color);
        }

        .nodo-encabezado {
            display: flex;
            align-items: center;
            background: #0d1117;
            padding: 8px 12px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            gap: 10px;
            transition: border-color 0.2s;
        }

        .nodo-encabezado:hover {
            border-color: var(--accent-color);
        }

        .texto-editable {
            flex: 1;
            outline: none;
            color: var(--text-color);
        }

        .texto-editable:focus {
            color: #ffffff;
        }

        /* BOTONES MODULARES */
        .btn-accion {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 1rem;
            padding: 4px 8px;
            border-radius: 4px;
            transition: background 0.2s;
        }

        .btn-accion:hover {
            background: #21262d;
        }

        .btn-toggle {
            color: var(--accent-color);
            font-weight: bold;
        }

        /* CONTENEDOR DE HIJOS (SUB-CARPETAS) */
        .nodo-hijos {
            margin: 0;
            padding: 0;
        }

        .oculto {
            display: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>🌳 Explorador de Objetivos Recursivo</h1>
        <p style="text-align: center; color: #8b949e; margin-bottom: 20px;">
            Haz clic en los textos para editarlos. Usa <b>+</b> para anidar infinitamente, <b>📂</b> para expandir/colapsar y <b>🗑️</b> para borrar.
        </p>

        <!-- RAÍZ DEL ÁRBOL -->
        <div class="arbol-raiz">
            <button class="btn-accion" style="background-color: var(--success-color); color: white; font-weight: bold; margin-bottom: 15px;" onclick="crearNodoRaiz()">+ Agregar Rama Principal</button>
            
            <ul id="raiz-principal" style="padding: 0; margin: 0;">
                <!-- Aquí se inyectarán todas las ramas de forma recursiva -->
            </ul>
        </div>
    </div>

    <!-- ================= LÓGICA RECURSIVA EN JAVASCRIPT ================= -->
    <script>
        // Función para crear una rama en el nivel de arriba (Raíz)
        function crearNodoRaiz() {
            let raiz = document.getElementById("raiz-principal");
            let nuevoNodo = generarEstructuraNodo("Nueva Rama Principal");
            raiz.appendChild(nuevoNodo);
        }

        // Función Constructora Recursiva: Fabrica la misma estructura sin importar el nivel de profundidad
        function generarEstructuraNodo(textoInicial) {
            let li = document.createElement("li");
            li.className = "nodo";

            // Creamos la barra de control del nodo
            let encabezado = document.createElement("div");
            encabezado.className = "nodo-encabezado";

            // Botón para colapsar / expandir sub-ramas
            let btnToggle = document.createElement("button");
            btnToggle.className = "btn-accion btn-toggle";
            btnToggle.innerText = "📁";
            btnToggle.onclick = function() {
                let contenedorHijos = li.querySelector(".nodo-hijos");
                if (contenedorHijos) {
                    contenedorHijos.classList.toggle("oculto");
                    btnToggle.innerText = contenedorHijos.classList.contains("oculto") ? "📁" : "📂";
                }
            };

            // Texto editable por el usuario
            let texto = document.createElement("span");
            texto.className = "texto-editable";
            texto.contentEditable = "true";
            texto.innerText = textoInicial;

            // Botón "+" para añadir un hijo (Recursividad en acción)
            let btnAgregarHijo = document.createElement("button");
            btnAgregarHijo.className = "btn-accion";
            btnAgregarHijo.style.color = "var(--accent-color)";
            btnAgregarHijo.innerText = "+";
            btnAgregarHijo.onclick = function() {
                let contenedorHijos = li.querySelector(".nodo-hijos");
                // Forzamos a expandir si estaba oculto al añadir un hijo
                contenedorHijos.classList.remove("oculto");
                btnToggle.innerText = "📂";
                
                // Llamada recursiva: genera otro nodo exactamente igual adentro de este
                let subNodo = generarEstructuraNodo("Sub-elemento anidado");
                contenedorHijos.appendChild(subNodo);
            };

            // Botón "🗑️" para eliminar este nodo y todos sus descendientes
            let btnEliminar = document.createElement("button");
            btnEliminar.className = "btn-accion";
            btnEliminar.innerText = "🗑️";
            btnEliminar.onclick = function() {
                li.remove();
            };

            // Contenedor para los futuros hijos de este nodo
            let ulHijos = document.createElement("ul");
            ulHijos.className = "nodo-hijos";

            // Ensamblamos los componentes en el orden correcto
            encabezado.appendChild(btnToggle);
            encabezado.appendChild(texto);
            encabezado.appendChild(btnAgregarHijo);
            encabezado.appendChild(btnEliminar);
            
            li.appendChild(encabezado);
            li.appendChild(ulHijos);

            return li;
        }

        // PRE-CARGAR TUS RAMAS INICIALES PARA QUE NO EMPIECE VACÍO
        window.onload = function() {
            let raiz = document.getElementById("raiz-principal");
            
            // Creamos tus tres pilares base usando la misma función
            let ramaAgenda = generarEstructuraNodo("📆 Agenda Personal");
            let ramaUanl = generarEstructuraNodo("🎓 Estudios UANL");
            let ramaLkq = generarEstructuraNodo("🚗 Operaciones LKQ");

            raiz.appendChild(ramaAgenda);
            raiz.appendChild(ramaUanl);
            raiz.appendChild(ramaLkq);
        };
    </script>
</body>
</html>
