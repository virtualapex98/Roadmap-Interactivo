<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Explorador de Objetivos Infinito</title>
    <style>
        :root {
            --bg-color: #0d1117;
            --card-bg: #161b22;
            --border-color: #30363d;
            --text-color: #c9d1d9;
            --accent-color: #58a6ff;
            --success-color: #238636;
            --danger-color: #da3637;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 800px;
        }

        h1 {
            color: #ffffff;
            text-align: center;
            margin-bottom: 30px;
        }

        /* CONTENEDOR PRINCIPAL DEL ÁRBOL */
        .arbol-raiz {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 20px;
        }

        /* LOGICA VISUAL DE NODOS ANIDADOS */
        .nodo {
            list-style: none;
            margin-top: 10px;
            padding-left: 20px;
            border-left: 1px dashed var(--border-color);
        }

        .nodo-encabezado {
            display: flex;
            align-items: center;
            background: #0d1117;
            padding: 8px 12px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            gap: 10px;
            transition: border-color 0.2s;
        }

        .nodo-encabezado:hover {
            border-color: var(--accent-color);
        }

        .texto-editable {
            flex: 1;
            outline: none;
            color: var(--text-color);
        }

        .texto-editable:focus {
            color: #ffffff;
        }

        /* BOTONES MODULARES */
        .btn-accion {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 1rem;
            padding: 4px 8px;
            border-radius: 4px;
            transition: background 0.2s;
        }

        .btn-accion:hover {
            background: #21262d;
        }

        .btn-toggle {
            color: var(--accent-color);
            font-weight: bold;
        }

        /* CONTENEDOR DE HIJOS (SUB-CARPETAS) */
        .nodo-hijos {
            margin: 0;
            padding: 0;
        }

        .oculto {
            display: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>🌳 Explorador de Objetivos Recursivo</h1>
        <p style="text-align: center; color: #8b949e; margin-bottom: 20px;">
            Haz clic en los textos para editarlos. Usa <b>+</b> para anidar infinitamente, <b>📂</b> para expandir/colapsar y <b>🗑️</b> para borrar.
        </p>

        <!-- RAÍZ DEL ÁRBOL -->
        <div class="arbol-raiz">
            <button class="btn-accion" style="background-color: var(--success-color); color: white; font-weight: bold; margin-bottom: 15px;" onclick="crearNodoRaiz()">+ Agregar Rama Principal</button>
            
            <ul id="raiz-principal" style="padding: 0; margin: 0;">
                <!-- Aquí se inyectarán todas las ramas de forma recursiva -->
            </ul>
        </div>
    </div>

    <!-- ================= LÓGICA RECURSIVA EN JAVASCRIPT ================= -->  
     <script>
        // Función auxiliar de UX para dar foco y seleccionar todo el texto de un elemento contenteditable
        function seleccionarTextoElemento(elemento) {
            elemento.focus();
            if (window.getSelection && document.createRange) {
                let rango = document.createRange();
                rango.selectNodeContents(elemento);
                let seleccion = window.getSelection();
                seleccion.removeAllRanges();
                seleccion.addRange(rango);
            }
        }

        // Función para crear una rama en el nivel de arriba (Raíz)
        function crearNodoRaiz() {
            let raiz = document.getElementById("raiz-principal");
            let nuevoNodo = generarEstructuraNodo("Nueva Rama Principal");
            raiz.appendChild(nuevoNodo);
            
            // Forzamos la edición inmediata al crear una nueva rama raíz
            let texto = nuevoNodo.querySelector(".texto-editable");
            texto.contentEditable = "true";
            seleccionarTextoElemento(texto);
        }

        // Función Constructora Recursiva: Fabrica la misma estructura sin importar el nivel de profundidad
        function generarEstructuraNodo(textoInicial) {
            let li = document.createElement("li");
            li.className = "nodo";

            // Creamos la barra de control del nodo
            let encabezado = document.createElement("div");
            encabezado.className = "nodo-encabezado";
            encabezado.style.cursor = "pointer"; // Toda la barra indica que es clickeable

            // Icono visual del estado de la carpeta
            let iconoCarpeta = document.createElement("span");
            iconoCarpeta.innerText = "📁 ";
            iconoCarpeta.style.pointerEvents = "none"; // Evita que interfiera con el click de la barra

            // Texto que por defecto NO es editable (para evitar falsos clicks)
            let texto = document.createElement("span");
            texto.className = "texto-editable";
            texto.contentEditable = "false"; 
            texto.innerText = textoInicial;
            texto.style.cursor = "pointer"; // Cambiado a pointer para reflejar que el centro también es el botón

            // Al presionar Enter, salimos del modo edición
            texto.onkeydown = function(e) {
                if (e.key === "Enter") {
                    e.preventDefault();
                    texto.blur();
                }
            };

            // Al perder el foco, bloqueamos el texto otra vez y devolvemos el cursor a tipo pointer
            texto.onblur = function() {
                texto.contentEditable = "false";
                texto.style.cursor = "pointer";
            };

            // Botón "✏️" para activar la edición
            let btnEditar = document.createElement("button");
            btnEditar.className = "btn-accion";
            btnEditar.innerText = "✏️";
            btnEditar.onclick = function(e) {
                e.stopPropagation(); // Aísla la acción del botón
                texto.contentEditable = "true";
                texto.style.cursor = "text"; // Cambia el cursor a modo texto solo al editar
                seleccionarTextoElemento(texto);
            };

            // Botón "+" para añadir un hijo (Recursividad)
            let btnAgregarHijo = document.createElement("button");
            btnAgregarHijo.className = "btn-accion";
            btnAgregarHijo.style.color = "var(--accent-color)";
            btnAgregarHijo.innerText = "+";
            btnAgregarHijo.onclick = function(e) {
                e.stopPropagation(); // Aísla la acción del botón
                
                let contenedorHijos = li.querySelector(".nodo-hijos");
                contenedorHijos.classList.remove("oculto");
                iconoCarpeta.innerText = "📂 ";
                
                let subNodo = generarEstructuraNodo("Sub-elemento anidado");
                contenedorHijos.appendChild(subNodo);

                // Forzamos la edición automática del subnodo recién creado
                let subTexto = subNodo.querySelector(".texto-editable");
                subTexto.contentEditable = "true";
                subTexto.style.cursor = "text";
                seleccionarTextoElemento(subTexto);
            };

            // Botón "🗑️" para eliminar este nodo y sus descendientes
            let btnEliminar = document.createElement("button");
            btnEliminar.className = "btn-accion";
            btnEliminar.innerText = "🗑️";
            btnEliminar.onclick = function(e) {
                e.stopPropagation(); // Aísla la acción del botón
                li.remove();
            };

            // Contenedor para los futuros hijos de este nodo
            let ulHijos = document.createElement("ul");
            ulHijos.className = "nodo-hijos";

            // LÓGICA PRINCIPAL: Toda la barra (incluido el centro y el texto) abre y cierra la carpeta
            encabezado.onclick = function(e) {
                // Solo colapsa/expande si el texto NO está en modo edición activo
                if (texto.contentEditable !== "true") {
                    if (ulHijos.children.length > 0) {
                        ulHijos.classList.toggle("oculto");
                        iconoCarpeta.innerText = ulHijos.classList.contains("oculto") ? "📁 " : "📂 ";
                    }
                }
            };

            // Ensamblamos los componentes en el orden correcto
            encabezado.appendChild(iconoCarpeta);
            encabezado.appendChild(texto);
            encabezado.appendChild(btnEditar);
            encabezado.appendChild(btnAgregarHijo);
            encabezado.appendChild(btnEliminar);
            
            li.appendChild(encabezado);
            li.appendChild(ulHijos);

            return li;
        }

        // PRE-CARGAR TUS RAMAS INICIALES
        window.onload = function() {
            let raiz = document.getElementById("raiz-principal");
            
            let ramaAgenda = generarEstructuraNodo("📆 Agenda Personal");
            let ramaUanl = generarEstructuraNodo("🎓 Estudios UANL");
            let ramaLkq = generarEstructuraNodo("🚗 Operaciones LKQ");

            raiz.appendChild(ramaAgenda);
            raiz.appendChild(ramaUanl);
            raiz.appendChild(ramaLkq);
        };
    </script>
</body>
</html>
